<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>لعبة الـ NPC الجديد — استدعاء بحرف B</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; font-family: "Segoe UI", Tahoma, Arial, sans-serif; background: #0b1020; }
  #game-canvas { position: fixed; inset: 0; display: block; }

  .hud {
    position: fixed; top: 12px; right: 12px; z-index: 10;
    background: rgba(10, 15, 35, 0.82); color: #fff;
    border: 1px solid rgba(120, 170, 255, 0.35);
    border-radius: 14px; padding: 14px 16px; width: 300px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.45); backdrop-filter: blur(6px);
  }
  .hud h1 { font-size: 17px; margin-bottom: 6px; color: #9fd0ff; }
  .hud p { font-size: 12.5px; line-height: 1.8; color: #d7e3ff; }
  .hud .keys { margin-top: 8px; background: rgba(255,255,255,0.06); border-radius: 10px; padding: 8px 10px; font-size: 12.5px; }
  .hud kbd {
    display: inline-block; min-width: 26px; text-align: center;
    background: #1d2b52; border: 1px solid #5b7fd6; border-bottom-width: 3px;
    border-radius: 6px; padding: 1px 7px; font-weight: bold; color: #fff;
  }
  .btn-row { display: flex; gap: 8px; margin-top: 10px; }
  button {
    flex: 1; cursor: pointer; border: none; border-radius: 10px;
    padding: 10px 6px; font-size: 13.5px; font-weight: bold; color: #fff;
    background: linear-gradient(135deg, #2f6bff, #6a4dff);
    box-shadow: 0 4px 14px rgba(60, 110, 255, 0.4);
    transition: transform 0.08s ease, filter 0.15s ease;
  }
  button:hover { filter: brightness(1.12); }
  button:active { transform: scale(0.96); }
  button.danger { background: linear-gradient(135deg, #ff4d5e, #b81f3a); box-shadow: 0 4px 14px rgba(255, 60, 80, 0.35); }

  #npc-count {
    position: fixed; top: 12px; left: 12px; z-index: 10;
    background: rgba(10, 15, 35, 0.82); color: #9fd0ff;
    border: 1px solid rgba(120, 170, 255, 0.35);
    border-radius: 12px; padding: 10px 18px; font-size: 15px; font-weight: bold;
  }
  #npc-count span { color: #fff; font-size: 20px; }

  #loading {
    position: fixed; inset: 0; z-index: 50; display: flex;
    flex-direction: column; align-items: center; justify-content: center;
    background: radial-gradient(circle at center, #16224d 0%, #070b1a 70%);
    color: #cfe1ff; gap: 14px; transition: opacity 0.4s ease;
  }
  #loading.hidden { opacity: 0; pointer-events: none; }
  #loading .spinner {
    width: 54px; height: 54px; border-radius: 50%;
    border: 5px solid rgba(140, 180, 255, 0.25); border-top-color: #6ea8ff;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #toast {
    position: fixed; bottom: 22px; right: 50%; transform: translateX(50%) translateY(20px);
    background: rgba(20, 30, 60, 0.92); color: #fff; z-index: 20;
    padding: 10px 22px; border-radius: 30px; font-size: 14px;
    border: 1px solid rgba(120, 170, 255, 0.4);
    opacity: 0; transition: all 0.3s ease; pointer-events: none;
  }
  #toast.show { opacity: 1; transform: translateX(50%) translateY(0); }
  @media (max-width: 640px) { .hud { width: calc(100% - 24px); } }
</style>
</head>
<body>

<canvas id="game-canvas"></canvas>

<div id="loading">
  <div class="spinner"></div>
  <div id="loading-text">جاري تحميل موديل الـ NPC الجديد...</div>
</div>

<div class="hud">
  <h1>🎮 الـ NPC الجديد (موديل GLB)</h1>
  <p>تم تركيب موديل <b>الرجل الجديد</b> بدل الـ NPC القديم. كل استدعاء يرسبّن نسخة منه مع أنيميشن Idle / Walk تلقائياً.</p>
  <div class="keys">
    <div><kbd>B</kbd> استدعاء NPC جديد</div>
    <div><kbd>C</kbd> مسح كل الـ NPCs</div>
    <div>🖱️ اضغط على أي NPC ليضرب Punch 👊</div>
    <div>🖱️ اسحب للتدوير • العجلة للتقريب</div>
  </div>
  <div class="btn-row">
    <button id="btn-spawn">➕ استدعاء (B)</button>
    <button id="btn-clear" class="danger">🗑️ مسح (C)</button>
  </div>
</div>

<div id="npc-count">عدد الـ NPCs: <span id="count-num">0</span></div>
<div id="toast"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';

// ============================================================
//  الإعدادات
// ============================================================
const NPC_GLB_URL = encodeURI('./Man in Long Sleeves by Quaternius - DLptRuewTn.glb');
const MAX_NPCS = 30;          // أقصى عدد NPCs
const ARENA_RADIUS = 22;      // نصف قطر منطقة التجول
const WALK_SPEED = 2.2;

// أسماء الأنيميشن داخل ملف الـ GLB
const ANIM = {
  idle:  'HumanArmature|Man_Idle',
  walk:  'HumanArmature|Man_Walk',
  run:   'HumanArmature|Man_Run',
  punch: 'HumanArmature|Man_Punch',
  clap:  'HumanArmature|Man_Clapping',
  jump:  'HumanArmature|Man_Jump',
  death: 'HumanArmature|Man_Death',
};

// ============================================================
//  المشهد الأساسي
// ============================================================
const canvas = document.getElementById('game-canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b1020);
scene.fog = new THREE.Fog(0x0b1020, 40, 110);

const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 300);
camera.position.set(10, 9, 14);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.2, 0);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI / 2 - 0.05;
controls.minDistance = 4;
controls.maxDistance = 60;

// إضاءة
scene.add(new THREE.HemisphereLight(0xbcd2ff, 0x33415e, 0.9));
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.position.set(12, 20, 8);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -30; sun.shadow.camera.right = 30;
sun.shadow.camera.top = 30; sun.shadow.camera.bottom = -30;
sun.shadow.camera.far = 60;
scene.add(sun);
const rim = new THREE.DirectionalLight(0x6ea8ff, 0.5);
rim.position.set(-10, 8, -12);
scene.add(rim);

// أرضية
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(30, 64),
  new THREE.MeshStandardMaterial({ color: 0x1c2b4d, roughness: 0.95, metalness: 0.05 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

const grid = new THREE.GridHelper(60, 30, 0x3d5a99, 0x27395f);
grid.position.y = 0.02;
scene.add(grid);

// حلقة منطقة الاستدعاء
const ring = new THREE.Mesh(
  new THREE.RingGeometry(ARENA_RADIUS - 0.25, ARENA_RADIUS, 72),
  new THREE.MeshBasicMaterial({ color: 0x4d7dff, transparent: true, opacity: 0.7, side: THREE.DoubleSide })
);
ring.rotation.x = -Math.PI / 2;
ring.position.y = 0.03;
scene.add(ring);

// نقطة الاستدعاء في الوسط
const spawnerDisc = new THREE.Mesh(
  new THREE.CircleGeometry(1.6, 48),
  new THREE.MeshBasicMaterial({ color: 0x4d7dff, transparent: true, opacity: 0.35 })
);
spawnerDisc.rotation.x = -Math.PI / 2;
spawnerDisc.position.y = 0.04;
scene.add(spawnerDisc);

// ============================================================
//  تحميل موديل الـ NPC الجديد (GLB)
// ============================================================
const loader = new GLTFLoader();
let npcTemplate = null;   // المشهد الأصلي للموديل
let npcClips = {};        // الأنيميشن
let modelReady = false;

const loadingEl = document.getElementById('loading');
const loadingText = document.getElementById('loading-text');

loader.load(
  NPC_GLB_URL,
  (gltf) => {
    npcTemplate = gltf.scene;
    npcTemplate.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = false; } });
    gltf.animations.forEach((clip) => { npcClips[clip.name] = clip; });
    modelReady = true;
    loadingEl.classList.add('hidden');
    toast('تم تحميل الـ NPC الجديد ✅ اضغط B للاستدعاء');
    // استدعاء 3 نسخ تلقائياً في البداية
    for (let i = 0; i < 3; i++) spawnNPC();
  },
  (xhr) => {
    if (xhr.total) {
      const pct = Math.round((xhr.loaded / xhr.total) * 100);
      loadingText.textContent = `جاري تحميل موديل الـ NPC الجديد... ${pct}%`;
    }
  },
  (err) => {
    console.error(err);
    loadingText.textContent = '❌ فشل تحميل ملف الـ GLB. تأكد أن الملف بجانب index.html';
  }
);

// ============================================================
//  كلاس الـ NPC الجديد — يرسبن بحرف B
// ============================================================
const npcs = [];
const countNum = document.getElementById('count-num');

class NPC {
  constructor(position) {
    // نسخ الموديل مع الهيكل العظمي (SkinnedMesh)
    this.group = SkeletonUtils.clone(npcTemplate);
    this.group.position.copy(position);
    this.group.rotation.y = Math.random() * Math.PI * 2;
    scene.add(this.group);

    this.mixer = new THREE.AnimationMixer(this.group);
    this.currentAction = null;
    this.state = 'idle';           // idle | walk | action
    this.stateTimer = Math.random() * 2 + 1;
    this.target = new THREE.Vector3();
    this.pickNewTarget();

    this.play(ANIM.idle);
    this.group.userData.npc = this; // للتعرف عليه عند الضغط
  }

  play(name, { loop = THREE.LoopRepeat, fade = 0.35, once = false } = {}) {
    const clip = npcClips[name];
    if (!clip) return null;
    const action = this.mixer.clipAction(clip);
    action.setLoop(once ? THREE.LoopOnce : loop, Infinity);
    action.clampWhenFinished = once;
    if (this.currentAction && this.currentAction !== action) {
      this.currentAction.fadeOut(fade);
    }
    action.reset().fadeIn(fade).play();
    this.currentAction = action;
    return action;
  }

  pickNewTarget() {
    const a = Math.random() * Math.PI * 2;
    const r = Math.random() * (ARENA_RADIUS - 2);
    this.target.set(Math.cos(a) * r, 0, Math.sin(a) * r);
  }

  // حركة لمرة واحدة (Punch عند الضغط عليه)
  doAction(name = ANIM.punch) {
    if (this.state === 'action') return;
    this.state = 'action';
    const action = this.play(name, { once: true, fade: 0.15 });
    if (!action) { this.state = 'idle'; return; }
    this.mixer.addEventListener('finished', () => {
      this.state = 'idle';
      this.stateTimer = 1 + Math.random() * 2;
      this.play(ANIM.idle);
    }, { once: true });
  }

  update(dt) {
    this.mixer.update(dt);
    if (this.state === 'action') return;

    this.stateTimer -= dt;
    if (this.state === 'idle') {
      if (this.stateTimer <= 0) {
        this.state = 'walk';
        this.pickNewTarget();
        this.play(ANIM.walk);
      }
    } else if (this.state === 'walk') {
      const pos = this.group.position;
      const dir = new THREE.Vector3().subVectors(this.target, pos);
      dir.y = 0;
      const dist = dir.length();
      if (dist < 0.4 || this.stateTimer <= -12) {
        this.state = 'idle';
        this.stateTimer = 1 + Math.random() * 3;
        this.play(ANIM.idle);
      } else {
        dir.normalize();
        pos.addScaledVector(dir, WALK_SPEED * dt);
        // دوران ناعم نحو الهدف
        const targetYaw = Math.atan2(dir.x, dir.z);
        let dy = targetYaw - this.group.rotation.y;
        while (dy > Math.PI) dy -= Math.PI * 2;
        while (dy < -Math.PI) dy += Math.PI * 2;
        this.group.rotation.y += dy * Math.min(1, dt * 8);
      }
    }
  }

  dispose() {
    scene.remove(this.group);
    this.mixer.stopAllAction();
  }
}

// ============================================================
//  الاستدعاء بحرف B
// ============================================================
function randomSpawnPoint() {
  const a = Math.random() * Math.PI * 2;
  const r = 2 + Math.random() * 5;
  return new THREE.Vector3(Math.cos(a) * r, 0, Math.sin(a) * r);
}

function spawnNPC() {
  if (!modelReady) { toast('انتظر تحميل الموديل... ⏳'); return; }
  if (npcs.length >= MAX_NPCS) { toast(`وصلت للحد الأقصى (${MAX_NPCS}) ⚠️`); return; }
  const npc = new NPC(randomSpawnPoint());
  npcs.push(npc);
  countNum.textContent = npcs.length;
  spawnFlash(npc.group.position);
}

function clearNPCs() {
  npcs.forEach((n) => n.dispose());
  npcs.length = 0;
  countNum.textContent = '0';
  toast('تم مسح كل الـ NPCs 🗑️');
}

// وميض دائري عند الاستدعاء
const flashes = [];
function spawnFlash(pos) {
  const m = new THREE.Mesh(
    new THREE.RingGeometry(0.3, 1.4, 40),
    new THREE.MeshBasicMaterial({ color: 0x7db4ff, transparent: true, opacity: 0.9, side: THREE.DoubleSide })
  );
  m.rotation.x = -Math.PI / 2;
  m.position.set(pos.x, 0.05, pos.z);
  scene.add(m);
  flashes.push({ mesh: m, life: 0.6 });
}

// الضغط على NPC = Punch 👊
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
renderer.domElement.addEventListener('pointerdown', (e) => {
  pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
  pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(npcs.map((n) => n.group), true);
  if (hits.length) {
    let obj = hits[0].object;
    while (obj && !obj.userData.npc) obj = obj.parent;
    if (obj && obj.userData.npc) obj.userData.npc.doAction(ANIM.punch);
  }
});

// ============================================================
//  التحكم
// ============================================================
window.addEventListener('keydown', (e) => {
  if (e.repeat) return;
  const k = e.key.toLowerCase();
  if (k === 'b' || k === 'ل') spawnNPC();       // B عربي/إنجليزي
  if (k === 'c' || k === 'ؤ') clearNPCs();
});
document.getElementById('btn-spawn').addEventListener('click', spawnNPC);
document.getElementById('btn-clear').addEventListener('click', clearNPCs);

let toastTimer = null;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

// ============================================================
//  حلقة اللعبة
// ============================================================
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  npcs.forEach((n) => n.update(dt));
  // تحديث وميض الاستدعاء
  for (let i = flashes.length - 1; i >= 0; i--) {
    const f = flashes[i];
    f.life -= dt;
    f.mesh.scale.multiplyScalar(1 + dt * 4);
    f.mesh.material.opacity = Math.max(0, f.life);
    if (f.life <= 0) { scene.remove(f.mesh); flashes.splice(i, 1); }
  }
  spawnerDisc.material.opacity = 0.28 + Math.sin(performance.now() * 0.003) * 0.12;
  controls.update();
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
